# Dedicated AMD64 or ARM64 Linux VPS with Binder; ADB binds to loopback ONLY.
# Validate host support before start. ReDroid does not require nested KVM.
# This is a compatibility candidate, not a production-certified configuration.
services:
  android:
    image: "${REDROID_IMAGE:?Pin a reviewed redroid/redroid@sha256 digest in .env before starting}"
    privileged: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:5555:5555'
    volumes:
      - './data:/data'
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=240
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
